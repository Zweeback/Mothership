name: Provenance regression fixtures

on:
  pull_request:
    paths:
      - "tests/fixtures/**"
      - "tests/test_provenance_regressions.py"
      - ".github/workflows/provenance-regressions.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run provenance regression tests
        run: python -m unittest tests.test_provenance_regressions -v
