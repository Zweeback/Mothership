name: GapGuard APK Test & Debug

on:
  push:
    branches: [ "gapguard-apk-build" ]
    paths:
      - "builds/gapguard/**"
      - ".ci/gapguard/**"
      - ".github/workflows/gapguard-apk-build.yml"
  workflow_dispatch:

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Reconstruct and patch source
        run: |
          set -euo pipefail
          cat builds/gapguard/source.b64.part* | base64 -d > /tmp/GapGuardAndroid.zip
          unzip -t /tmp/GapGuardAndroid.zip
          rm -rf /tmp/gapguard-src && mkdir -p /tmp/gapguard-src
          unzip -q /tmp/GapGuardAndroid.zip -d /tmp/gapguard-src
          cd /tmp/gapguard-src/GapGuardAndroid
          patch --batch -p2 < "$GITHUB_WORKSPACE/.ci/gapguard/gapguard-v0.3.patch"
          grep -E 'compileSdk|targetSdk|minSdk|versionCode|versionName' app/build.gradle

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.5.0'

      - name: Pure Java regression tests
        working-directory: /tmp/gapguard-src/GapGuardAndroid
        run: |
          set -euo pipefail
          rm -rf /tmp/gapmath-test && mkdir -p /tmp/gapmath-test
          javac -d /tmp/gapmath-test app/src/main/java/de/bentropie/gapguard/GapMath.java logic-test/GapMathTest.java
          java -cp /tmp/gapmath-test GapMathTest

      - name: Android lint
        working-directory: /tmp/gapguard-src/GapGuardAndroid
        run: gradle :app:lintDebug --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: /tmp/gapguard-src/GapGuardAndroid
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK package and signature
        working-directory: /tmp/gapguard-src/GapGuardAndroid
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | tee /tmp/gapguard-badging.txt
          grep -q "package: name='de.bentropie.gapguard' versionCode='3' versionName='0.3.0'" /tmp/gapguard-badging.txt
          grep -q "minSdkVersion:'23'" /tmp/gapguard-badging.txt
          grep -q "targetSdkVersion:'36'" /tmp/gapguard-badging.txt
          sha256sum "$APK" | tee /tmp/gapguard-apk.sha256
          ls -lh "$APK"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Runtime smoke test on Android 15 / API 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash "$GITHUB_WORKSPACE/.ci/gapguard/runtime-smoke.sh"

      - name: Package patched source and evidence
        if: always()
        run: |
          cd /tmp/gapguard-src
          zip -qr /tmp/GapGuardAndroid_v0.3_source.zip GapGuardAndroid
          cp /tmp/gapguard-src/GapGuardAndroid/app/build/reports/lint-results-debug.html /tmp/ 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GapGuard-v0.3-debug-apk
          path: /tmp/gapguard-src/GapGuardAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GapGuard-v0.3-test-evidence
          path: |
            /tmp/GapGuardAndroid_v0.3_source.zip
            /tmp/gapguard-apk.sha256
            /tmp/gapguard-badging.txt
            /tmp/lint-results-debug.html
            /tmp/gapguard-runtime-events.csv
            /tmp/gapguard-runtime-prefs.xml
            /tmp/gapguard-runtime-prefs-after-recal.xml
            /tmp/gapguard-runtime-capability.txt
            /tmp/gapguard-services.txt
            /tmp/gapguard-am-start.txt
          if-no-files-found: warn
