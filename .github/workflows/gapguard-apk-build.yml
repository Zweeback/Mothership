name: GapGuard APK Build

on:
  push:
    branches: [ "gapguard-apk-build" ]
    paths:
      - "builds/gapguard/**"
      - ".github/workflows/gapguard-apk-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source archive
        run: |
          cat builds/gapguard/source.b64.part* | base64 -d > /tmp/GapGuardAndroid.zip
          unzip -t /tmp/GapGuardAndroid.zip
          mkdir -p /tmp/gapguard-src
          unzip -q /tmp/GapGuardAndroid.zip -d /tmp/gapguard-src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        working-directory: /tmp/gapguard-src/GapGuardAndroid
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        working-directory: /tmp/gapguard-src/GapGuardAndroid
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GapGuard-v0.2-debug-apk
          path: /tmp/gapguard-src/GapGuardAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
