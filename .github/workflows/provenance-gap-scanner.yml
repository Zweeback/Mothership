name: Provenance gap scanner

on:
  pull_request:
    paths:
      - "tools/provenance_gap_scanner.py"
      - "tests/test_provenance_gap_scanner.py"
      - ".github/workflows/provenance-gap-scanner.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile scanner
        run: python -m py_compile tools/provenance_gap_scanner.py
      - name: Run scanner tests
        run: python -m unittest tests.test_provenance_gap_scanner -v
