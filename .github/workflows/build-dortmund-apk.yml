name: Build Dortmund Godot APK

on:
  push:
    branches: [build/dortmund-godot-apk]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;35.0.1" "platforms;android-35"

      - name: Restore Godot project
        shell: bash
        run: |
          mkdir -p game
          echo '' | base64 -d > /tmp/game.zip
          unzip -q /tmp/game.zip -d game
          mkdir -p game/build

      - name: Install Godot 4.7.1 and export templates
        shell: bash
        run: |
          curl -L --retry 4 -o /tmp/godot.zip "https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.1"
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          sudo mv /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 /usr/local/bin/godot

          curl -L --retry 4 -o /tmp/templates.tpz "https://downloads.godotengine.org/?flavor=stable&platform=templates&slug=export_templates.tpz&version=4.7.1"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.1.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -a /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.1.stable/"

      - name: Configure Godot Android paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          JAVA_HOME_REAL="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          ANDROID_SDK_REAL="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME_REAL"
          export/android/android_sdk_path = "$ANDROID_SDK_REAL"
          EOF

          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Import and validate project
        run: |
          godot --headless --editor --path game --quit
          godot --headless --path game --quit-after 2

      - name: Export installable APK
        run: |
          godot --headless --path game --export-debug "Android" "$GITHUB_WORKSPACE/DortmundGameMap.apk"
          ls -lh "$GITHUB_WORKSPACE/DortmundGameMap.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DortmundGameMap-APK
          path: DortmundGameMap.apk
          if-no-files-found: error
