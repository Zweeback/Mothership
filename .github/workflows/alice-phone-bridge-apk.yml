name: ALICE Phone Bridge Storage Diagnostic APK
on:
  push:
    paths:
      - 'apps/alice-phone-bridge/**'
      - '.github/workflows/alice-phone-bridge-apk.yml'
  pull_request:
    paths:
      - 'apps/alice-phone-bridge/**'
      - '.github/workflows/alice-phone-bridge-apk.yml'
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Assemble Android APK
        run: gradle -p apps/alice-phone-bridge --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: alice-phone-bridge-storage-debug-apk
          path: apps/alice-phone-bridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
